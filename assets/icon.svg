<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1e4f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 squircle centered on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- A branch merging back into main, its head approved -->
  <g filter="url(#shadow)" fill="#ffffff" stroke="#ffffff" stroke-linecap="round">
    <line x1="364" y1="320" x2="364" y2="704" stroke-width="56"/>
    <path d="M620 470 C620 600 364 580 364 680" fill="none" stroke-width="56"/>
    <circle cx="364" cy="312" r="68" stroke="none"/>
    <circle cx="364" cy="712" r="68" stroke="none"/>
    <circle cx="620" cy="384" r="116" stroke="none"/>
  </g>
  <path d="M566 386 L604 424 L676 350" fill="none" stroke="url(#check)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
